name: Dev deployed E2E

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-deployed-e2e
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:functions

  deployed-e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://gadgetdesign-dev.netlify.app
      DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for this exact Netlify deploy
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          for attempt in {1..60}; do
            body="$(curl -fsS --max-time 10 "${E2E_BASE_URL}/build-info.json?attempt=${attempt}" 2>/dev/null || true)"
            deployed="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")"
            if [ "$deployed" = "$expected" ]; then
              echo "Netlify dev is serving commit $deployed"
              exit 0
            fi
            echo "Waiting for Netlify: expected=$expected deployed=${deployed:-unknown} ($attempt/60)"
            sleep 10
          done
          echo "Netlify did not deploy commit $expected within 10 minutes."
          exit 1

      - name: Require dev admin secret
        shell: bash
        run: |
          if [ -z "${DEV_ADMIN_PASSWORD}" ]; then
            echo "Missing GitHub Actions secret DEV_ADMIN_PASSWORD."
            exit 1
          fi

      - name: Run Playwright against deployed dev
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
